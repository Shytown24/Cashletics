<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASHLETICS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CASHLETICS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E2B25">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* ===== Paste your Client Portal link (ends in /exec) into PORTAL_URL below ===== */
  :root{--navy:#1E2B25;--bg:#0F1714;--tab:#172420}
  html,body{margin:0;height:100%;background:var(--navy);overflow:hidden}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  #app{flex:1;width:100%;border:0;display:block;background:var(--bg)}
  #foot{height:env(safe-area-inset-bottom,0px);background:var(--tab)}
  #splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--navy);transition:opacity .25s;z-index:2}
  .logo{position:relative;width:230px;height:230px;margin:0 auto;perspective:700px;-webkit-perspective:700px}
  .logo img{position:absolute;left:0;top:0;width:100%;height:100%}
  .logo img.dol{left:32.5352%;top:34.9296%;width:35.493%;height:29.0141%;-webkit-animation:dolspin 3.6s linear infinite;animation:dolspin 3.6s linear infinite;will-change:transform}
  @-webkit-keyframes dolspin{from{-webkit-transform:rotateY(0deg)}to{-webkit-transform:rotateY(360deg)}}
  @keyframes dolspin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
  @media (prefers-reduced-motion:reduce){.logo img.dol{-webkit-animation:none;animation:none}}
  #splash .logo{width:260px;height:260px}
  #splash.gone{opacity:0;pointer-events:none}
  #err{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));color:#F2F4F1;font:15px/1.4 -apple-system,system-ui,sans-serif;text-align:center;display:none;z-index:3}
  #err a{color:#F2F4F1}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="logo"><img src="logo-base.png?v=4" alt=""><img class="dol" src="logo-dol.png?v=4" alt=""></div></div>
<iframe id="app" title="CASHLETICS" allow="clipboard-write"></iframe>
<div id="foot"></div>
<p id="err" role="alert">Taking a while to load. <a id="direct" href="#">Open the portal directly</a></p>
<script>
  var PORTAL_URL = 'https://script.google.com/macros/s/AKfycbz7DJRu0jVk8m0cR7NOuaT_ri4D17fwPsX9iUQXtwkxWdk24G8Q5xBF7Oy4WZGxywQ/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  document.getElementById('direct').href = PORTAL_URL;
  f.addEventListener('load', function () { setTimeout(function () { sp.classList.add('gone'); }, 150); });
  f.src = PORTAL_URL + (PORTAL_URL.indexOf('?') < 0 ? '?' : '&') + 'embed=1';   // tells the portal this app already handles the notch space
  setTimeout(function () { if (!sp.classList.contains('gone')) document.getElementById('err').style.display = 'block'; }, 12000);

  // Keeps the portal's sign-in here, because phones wipe what the portal saves inside its Google frame.
  var TOKEN_KEY = 'cashletics-token';
  window.addEventListener('message', function (e) {
    var d = e.data;
    // only the portal frame inside this page, never another site that opened this one
    if (!e.source || e.source.top !== window) return;
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !d || typeof d !== 'object') return;
    try {
      if (d.cashletics === 'getToken') e.source.postMessage({ cashletics: 'token', token: localStorage.getItem(TOKEN_KEY) || '' }, e.origin);
      else if (d.cashletics === 'token') { if (d.token) localStorage.setItem(TOKEN_KEY, String(d.token)); else localStorage.removeItem(TOKEN_KEY); }
    } catch (err) {}
  });
</script>
</body>
</html>
